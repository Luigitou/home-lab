services:
  # ──────────────────────────────────────────────────────────
  # DEV – Vite dev server with hot reload
  # Usage: docker compose up dev
  # ──────────────────────────────────────────────────────────
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      # Mount the whole project so edits are reflected instantly
      - .:/app
      # Keep the container's node_modules separate from the host's
      - /app/node_modules
    environment:
      # Force file-system polling so inotify works inside Docker on Linux/macOS/WSL
      - CHOKIDAR_USEPOLLING=true
      - VITE_POLL=true
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # PROD – Production build
  # Usage: docker compose up prod --build
  # ──────────────────────────────────────────────────────────
  prod:
    build:
      context: .
      target: prod
    ports:
      - "3000:3000"
    restart: unless-stopped

